    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      color: #1C1C1E;
    }
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 36px 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 440px;
      width: 100%;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 26px;
      letter-spacing: -0.5px;
    }
    p {
      color: #68686F;
      margin: 0 0 24px 0;
      font-size: 15px;
      line-height: 1.4;
    }
    .qr-box {
      background: #fff;
      padding: 16px;
      border-radius: 16px;
      display: inline-block;
      border: 1px solid #E7E7ED;
      margin-bottom: 24px;
    }
    .url {
      background: #F6F6F9;
      padding: 12px 16px;
      border-radius: 12px;
      font-family: monospace;
      font-size: 14px;
      word-break: break-all;
      margin-bottom: 20px;
      color: #0064D9;
      font-weight: 600;
    }
    .accounts {
      text-align: left;
      background: #FAFAFC;
      border-radius: 14px;
      padding: 16px;
      font-size: 13px;
      border: 1px solid #EAEAEE;
    }
    .accounts h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      color: #1C1C1E;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      background: #E9EFEC;
      color: #24754B;
      margin-left: 6px;
    }
  </style>
